<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔐 CONFIG */
const BUSINESS_ID = "voixit-office";
const ADMIN_CODE = "Whywhy455";

/* 🕘 BUSINESS HOURS */
const OPEN_TIME = "09:00";
const CLOSE_TIME = "17:00";
const TIME_INTERVAL = 30;

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDVzSU2qASOg8G3XJopcS14QZVKP1dO0EU",
  authDomain: "appointment-app-id.firebaseapp.com",
  projectId: "appointment-app-id",
  storageBucket: "appointment-app-id.firebasestorage.app",
  messagingSenderId: "753346372273",
  appId: "1:753346372273:web:7ecc59ff17f1fc56963890"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 ADMIN STATE */
let isAdmin = sessionStorage.getItem("isAdmin") === "true";

/* 📅 PREVENT PAST DATES */
const today = new Date().toISOString().split("T")[0];
document.getElementById("date").min = today;

/* ⏰ TIME INPUT RULES */
const timeInput = document.getElementById("time");
timeInput.min = OPEN_TIME;
timeInput.max = CLOSE_TIME;
timeInput.step = TIME_INTERVAL * 60;

/* 📋 ADMIN UI */
const queueTitle = document.getElementById("queueTitle");
const appointmentsList = document.getElementById("appointments");

if (isAdmin) enableAdminUI();

/* 🔑 ADMIN LOGIN */
document.getElementById("adminBtn").onclick = () => {
  const code = prompt("Enter admin code:");
  if (code === ADMIN_CODE) {
    sessionStorage.setItem("isAdmin", "true");
    isAdmin = true;
    enableAdminUI();
    alert("Admin access granted");
  } else {
    alert("Wrong admin code");
  }
};

/* 📌 ENABLE ADMIN VIEW */
function enableAdminUI() {
  queueTitle.style.display = "block";
  appointmentsList.style.display = "block";
  loadAppointments();
}

/* 📌 BOOK APPOINTMENT */
document.getElementById("bookBtn").onclick = async () => {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  if (!name || !phone || !date || !time) {
    alert("Please fill all fields");
    return;
  }

  if (time < OPEN_TIME || time >= CLOSE_TIME) {
    alert("Selected time is outside business hours");
    return;
  }

  const q = query(
    collection(db, "appointments"),
    where("businessId", "==", BUSINESS_ID),
    where("date", "==", date),
    where("time", "==", time)
  );

  const snap = await getDocs(q);
  if (!snap.empty) {
    alert("This date and time is already booked");
    return;
  }

  await addDoc(collection(db, "appointments"), {
    businessId: BUSINESS_ID,
    name,
    phone,
    date,
    time,
    createdAt: Date.now()
  });

  alert("Appointment booked successfully");
  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
};

/* 📋 LOAD APPOINTMENTS */
async function loadAppointments() {
  if (!isAdmin) return;

  appointmentsList.innerHTML = "";

  const q = query(
    collection(db, "appointments"),
    where("businessId", "==", BUSINESS_ID)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const li = document.createElement("li");
    li.innerHTML = `
      <div>
        <strong>${data.name}</strong><br>
        ${data.phone}<br>
        ${data.date} at ${data.time}
      </div>
    `;

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "delete";
    del.onclick = async () => {
      await deleteDoc(doc(db, "appointments", d.id));
      loadAppointments();
    };

    li.appendChild(del);
    appointmentsList.appendChild(li);
  });
}
</script>
