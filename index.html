<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book an Appointment</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    padding: 20px;
    max-width: 500px;
    margin: auto;
  }
  h1, h2 { text-align: center; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    font-size: 16px;
  }
  button {
    background: #007bff;
    color: white;
    border: none;
    margin-top: 20px;
    cursor: pointer;
  }
  ul { list-style: none; padding: 0; }
  li {
    background: white;
    padding: 10px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .delete {
    background: red;
    color: white;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>Book an Appointment</h1>

<label>Full Name</label>
<input id="name" placeholder="Enter full name">

<label>Country</label>
<select id="country">
  <option value="NG" data-code="+234" data-tz="Africa/Lagos">🇳🇬 Nigeria (+234)</option>
  <option value="US" data-code="+1" data-tz="America/New_York">🇺🇸 USA (+1)</option>
  <option value="GB" data-code="+44" data-tz="Europe/London">🇬🇧 UK (+44)</option>
  <option value="CA" data-code="+1" data-tz="America/Toronto">🇨🇦 Canada (+1)</option>
</select>

<label>Phone Number</label>
<input id="phone" placeholder="Enter phone number">

<label>Appointment Date</label>
<input id="date" type="date">

<label>Appointment Time</label>
<input id="time" type="time">

<button id="bookBtn">Book Appointment</button>
<button id="adminBtn">Admin Login</button>

<!-- 🔐 ADMIN DASHBOARD -->
<div id="dashboard" style="display:none;">
  <h2>Admin Dashboard</h2>

  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <div style="flex:1; background:white; padding:10px; text-align:center;">
      <h3 id="totalCount">0</h3>
      <small>Total Appointments</small>
    </div>

    <div style="flex:1; background:white; padding:10px; text-align:center;">
      <h3 id="todayCount">0</h3>
      <small>Today</small>
    </div>
  </div>

  <h2>Appointment Queue</h2>
  <ul id="appointments"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔐 CONFIG */
const BUSINESS_ID = "voixit-office";
const ADMIN_CODE = "Whywhy455";

/* 🕘 BUSINESS HOURS */
const OPEN_TIME = "09:00";
const CLOSE_TIME = "17:00";
const TIME_INTERVAL = 30;

/* 🕒 BUSINESS TIMEZONE (ADMIN USES THIS) */
const BUSINESS_TIMEZONE = "Africa/Lagos";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDVzSU2qASOg8G3XJopcS14QZVKP1dO0EU",
  authDomain: "appointment-app-id.firebaseapp.com",
  projectId: "appointment-app-id",
  storageBucket: "appointment-app-id.firebasestorage.app",
  messagingSenderId: "753346372273",
  appId: "1:753346372273:web:7ecc59ff17f1fc56963890"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 ADMIN STATE */
let isAdmin = sessionStorage.getItem("isAdmin") === "true";

/* 🌍 COUNTRY HANDLING */
const countrySelect = document.getElementById("country");
const phoneInput = document.getElementById("phone");

countrySelect.onchange = () => {
  phoneInput.value = countrySelect.selectedOptions[0].dataset.code + " ";
};

/* 📅 COUNTRY-AWARE DATE */
function getLocalDateForSelectedCountry() {
  const tz = countrySelect.selectedOptions[0].dataset.tz;
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: tz,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

document.getElementById("date").min = getLocalDateForSelectedCountry();

/* ⏰ TIME RULES */
const timeInput = document.getElementById("time");
timeInput.min = OPEN_TIME;
timeInput.max = CLOSE_TIME;
timeInput.step = TIME_INTERVAL * 60;

/* 📋 ADMIN UI */
const dashboard = document.getElementById("dashboard");
const appointmentsList = document.getElementById("appointments");

if (isAdmin) enableAdminUI();

/* 🔑 ADMIN LOGIN */
document.getElementById("adminBtn").onclick = () => {
  const code = prompt("Enter admin code:");
  if (code === ADMIN_CODE) {
    sessionStorage.setItem("isAdmin", "true");
    isAdmin = true;
    enableAdminUI();
    alert("Admin access granted");
  } else {
    alert("Wrong admin code");
  }
};

/* 📌 ENABLE ADMIN UI */
function enableAdminUI() {
  dashboard.style.display = "block";
  loadAppointments();
}

/* 📌 BOOK APPOINTMENT */
document.getElementById("bookBtn").onclick = async () => {
  const name = document.getElementById("name").value.trim();
  const phone = phoneInput.value.trim();
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const timezone = countrySelect.selectedOptions[0].dataset.tz;

  if (!name || !phone || !date || !time) {
    alert("Please fill all fields");
    return;
  }

  if (time < OPEN_TIME || time >= CLOSE_TIME) {
    alert("Selected time is outside business hours");
    return;
  }

  const q = query(
    collection(db, "appointments"),
    where("businessId", "==", BUSINESS_ID),
    where("date", "==", date),
    where("time", "==", time)
  );

  const snap = await getDocs(q);
  if (!snap.empty) {
    alert("This date and time is already booked");
    return;
  }

  await addDoc(collection(db, "appointments"), {
    businessId: BUSINESS_ID,
    name,
    phone,
    date,
    time,
    country: countrySelect.value,
    timezone,
    createdAt: Date.now()
  });

  alert("Appointment booked successfully");
  document.getElementById("name").value = "";
  phoneInput.value = "";
};

/* 📊 LOAD APPOINTMENTS + DASHBOARD */
async function loadAppointments() {
  if (!isAdmin) return;

  appointmentsList.innerHTML = "";

  const q = query(
    collection(db, "appointments"),
    where("businessId", "==", BUSINESS_ID)
  );

  const snap = await getDocs(q);

  let total = 0;
  let todayTotal = 0;

  const today = new Intl.DateTimeFormat("en-CA", {
    timeZone: BUSINESS_TIMEZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());

  snap.forEach(d => {
    total++;
    const data = d.data();
    if (data.date === today) todayTotal++;

    const li = document.createElement("li");
    li.innerHTML = `
      <div>
        <strong>${data.name}</strong><br>
        ${data.phone}<br>
        ${data.date} at ${data.time}
      </div>
    `;

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "delete";
    del.onclick = async () => {
      await deleteDoc(doc(db, "appointments", d.id));
      loadAppointments();
    };

    li.appendChild(del);
    appointmentsList.appendChild(li);
  });

  document.getElementById("totalCount").textContent = total;
  document.getElementById("todayCount").textContent = todayTotal;
}
</script>

</body>
</html>
