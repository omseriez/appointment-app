<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {

  const BUSINESS_ID = "voixit-office";
  const ADMIN_CODE = "Whywhy455";

  const OPEN_TIME = "09:00";
  const CLOSE_TIME = "17:00";
  const TIME_INTERVAL = 30;

  const BUSINESS_TIMEZONE = "Africa/Lagos";

  const firebaseConfig = {
    apiKey: "AIzaSyDVzSU2qASOg8G3XJopcS14QZVKP1dO0EU",
    authDomain: "appointment-app-id.firebaseapp.com",
    projectId: "appointment-app-id",
    storageBucket: "appointment-app-id.firebasestorage.app",
    messagingSenderId: "753346372273",
    appId: "1:753346372273:web:7ecc59ff17f1fc56963890"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let isAdmin = sessionStorage.getItem("isAdmin") === "true";

  const countrySelect = document.getElementById("country");
  const phoneInput = document.getElementById("phone");
  const dateInput = document.getElementById("date");
  const timeInput = document.getElementById("time");
  const dashboard = document.getElementById("dashboard");
  const appointmentsList = document.getElementById("appointments");

  function getLocalDate() {
    const tz = countrySelect.selectedOptions[0].dataset.tz;
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: tz,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  dateInput.min = getLocalDate();

  countrySelect.addEventListener("change", () => {
    phoneInput.value = countrySelect.selectedOptions[0].dataset.code + " ";
    dateInput.min = getLocalDate();
  });

  timeInput.min = OPEN_TIME;
  timeInput.max = CLOSE_TIME;
  timeInput.step = TIME_INTERVAL * 60;

  document.getElementById("adminBtn").onclick = () => {
    const code = prompt("Enter admin code");
    if (code === ADMIN_CODE) {
      sessionStorage.setItem("isAdmin", "true");
      isAdmin = true;
      dashboard.style.display = "block";
      loadAppointments();
    } else {
      alert("Wrong code");
    }
  };

  document.getElementById("bookBtn").onclick = async () => {
    const name = document.getElementById("name").value.trim();
    const phone = phoneInput.value.trim();
    const date = dateInput.value;
    const time = timeInput.value;

    if (!name || !phone || !date || !time) {
      alert("Fill all fields");
      return;
    }

    const q = query(
      collection(db, "appointments"),
      where("businessId", "==", BUSINESS_ID),
      where("date", "==", date),
      where("time", "==", time)
    );

    const snap = await getDocs(q);
    if (!snap.empty) {
      alert("Already booked");
      return;
    }

    await addDoc(collection(db, "appointments"), {
      businessId: BUSINESS_ID,
      name,
      phone,
      date,
      time,
      businessDate: new Intl.DateTimeFormat("en-CA", {
        timeZone: BUSINESS_TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date()),
      createdAt: Date.now()
    });

    alert("Booked successfully");
  };

  async function loadAppointments() {
    appointmentsList.innerHTML = "";

    const snap = await getDocs(
      query(collection(db, "appointments"), where("businessId", "==", BUSINESS_ID))
    );

    snap.forEach(d => {
      const data = d.data();
      const li = document.createElement("li");
      li.textContent = `${data.name} – ${data.date} ${data.time}`;
      appointmentsList.appendChild(li);
    });
  }

});
</script>
