<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointment & Queue App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff;
      margin-top: 10px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button.delete {
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Book an Appointment</h1>

<input id="name" placeholder="Your name" />
<input id="phone number" placeholder="phone number" />
<input id="date" type="date" />
<input id="time" type="time" />
<button onclick="bookAppointment()">Book Appointment</button>

<h2>Appointment Queue</h2>
<ul id="appointments"></ul>

<script type="module">
  // Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDVzSU2qASOg8G3XJopcS14QZVKP1dO0EU",
    authDomain: "appointment-app-id.firebaseapp.com",
    projectId: "appointment-app-id",
    storageBucket: "appointment-app-id.firebasestorage.app",
    messagingSenderId: "753346372273",
    appId: "1:753346372273:web:7ecc59ff17f1fc56963890"
  };

  // Init Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Book appointment (with double-booking prevention)
  window.bookAppointment = async function () {
    const name = document.getElementById("name").value.trim();
    const phone number = document.getElementById("phone number").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if (!name || !phone number || !date || !time) {
      alert("Please fill all fields");
      return;
    }

    // Check if slot already exists
    const q = query(
      collection(db, "appointments"),
      where("date", "==", date),
      where("time", "==", time)
    );

    const snapshot = await getDocs(q);
    if (!snapshot.empty) {
      alert("This time is already booked!");
      return;
    }

    // Save appointment
    await addDoc(collection(db, "appointments"), {
      name,
      phone number,
      date,
      time,
      createdAt: Date.now()
    });

    document.getElementById("name").value = "";
    loadAppointments();
  };

  // Load appointments
  async function loadAppointments() {
    const list = document.getElementById("appointments");
    list.innerHTML = "";

    const snapshot = await getDocs(collection(db, "appointments"));

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      const li = document.createElement("li");
      li.textContent = `${data.date} ${data.time} - ${data.number} - ${data.name}`;

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "delete";
      del.onclick = async () => {
        await deleteDoc(doc(db, "appointments", docSnap.id));
        loadAppointments();
      };

      li.appendChild(del);
      list.appendChild(li);
    });
  }

  loadAppointments();
</script>

</body>
</html>
